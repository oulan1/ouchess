<!DOCTYPE html>
<html lang="ru" style="color-scheme: dark;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#13111c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ouChess — Тактическая арена 1v1</title>
  <link rel="icon" type="image/png" href="512.png">
  <link rel="apple-touch-icon" href="1024.png">
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg: #13111c;
      --surface: #1d192b;
      --surface-high: #28233a;
      --primary: #d0bcff;
      --on-primary: #381e72;
      --primary-container: #4f378b;
      --on-primary-container: #eaddff;
      --text: #ece6f5;
      --muted: #b7aecb;
      --outline: rgba(216, 204, 245, 0.12);
      --green: #6ee7b7;
      --amber: #fcd34d;
      --amber-bg: rgba(252, 211, 77, 0.14);
      --green-bg: rgba(110, 231, 183, 0.14);
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .portal-card {
      width: 100%;
      max-width: 460px;
      background-color: var(--surface);
      border: 1px solid var(--outline);
      border-radius: 28px;
      padding: 32px 28px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      animation: cardEnter 260ms var(--ease-out);
    }

    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .brand-logo {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      margin: 0 auto 18px;
      overflow: hidden;
      border: 2px solid rgba(208, 188, 255, 0.25);
      background-color: var(--surface-high);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 14px;
      background-color: var(--surface-high);
      color: var(--muted);
      border: 1px solid var(--outline);
    }

    .status-chip.online {
      background-color: var(--green-bg);
      color: var(--green);
      border-color: rgba(110, 231, 183, 0.35);
    }

    .status-chip.maintenance {
      background-color: var(--amber-bg);
      color: var(--amber);
      border-color: rgba(252, 211, 77, 0.35);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: currentColor;
    }

    h1 {
      font-size: 24px;
      line-height: 30px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }

    p {
      font-size: 14px;
      line-height: 21px;
      color: var(--muted);
      margin-bottom: 22px;
    }

    .m3-linear-progress {
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background-color: var(--surface-high);
      overflow: hidden;
      position: relative;
      margin-bottom: 18px;
    }

    .m3-linear-bar {
      position: absolute;
      height: 100%;
      width: 42%;
      border-radius: 999px;
      background-color: var(--primary);
      animation: indeterminate 1.35s cubic-bezier(0.77, 0, 0.175, 1) infinite;
    }

    @keyframes indeterminate {
      0% { left: -45%; }
      65% { left: 100%; }
      100% { left: 100%; }
    }

    .actions-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .m3-btn {
      width: 100%;
      height: 44px;
      padding: 0 20px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 140ms var(--ease-out), filter 140ms var(--ease-out), background-color 140ms var(--ease-out);
    }

    .m3-btn:active {
      transform: scale(0.98);
    }

    .m3-btn-filled {
      background-color: var(--primary);
      color: var(--on-primary);
    }
    .m3-btn-filled:hover { filter: brightness(1.06); }

    .m3-btn-tonal {
      background-color: var(--primary-container);
      color: var(--on-primary-container);
    }
    .m3-btn-tonal:hover { filter: brightness(1.1); }

    .m3-btn-outlined {
      background-color: transparent;
      border-color: var(--outline);
      color: var(--text);
    }
    .m3-btn-outlined:hover { background-color: var(--surface-high); }

    .meta-footer {
      margin-top: 18px;
      font-size: 12px;
      color: var(--muted);
      opacity: 0.78;
    }
  </style>
</head>
<body>
  <main class="portal-card">
    <div class="brand-logo">
      <img src="512.png" alt="ouChess">
    </div>

    <div class="status-chip" id="statusChip">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="statusChipText">Проверка статуса арены…</span>
    </div>

    <h1 id="portalTitle">ouChess</h1>
    <p id="portalSubtitle">Подключаемся к постоянному шлюзу тактической арены 1v1…</p>

    <div class="m3-linear-progress" id="progressBar">
      <div class="m3-linear-bar"></div>
    </div>

    <div class="actions-stack">
      <button type="button" class="m3-btn m3-btn-filled" id="launchBtn" style="display: none;">
        Открыть арену ouChess
      </button>

      <button type="button" class="m3-btn m3-btn-tonal" id="installBtn" style="display: none;">
        Установить как приложение (PWA)
      </button>

      <button type="button" class="m3-btn m3-btn-outlined" id="retryBtn" style="display: none;">
        Проверить подключение сейчас
      </button>
    </div>

    <div class="meta-footer" id="footerNote">Постоянный адрес портала · Автообновление</div>
  </main>

  <script>
    (() => {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      }

      const chipEl = document.getElementById("statusChip");
      const chipTextEl = document.getElementById("statusChipText");
      const titleEl = document.getElementById("portalTitle");
      const subEl = document.getElementById("portalSubtitle");
      const progressEl = document.getElementById("progressBar");
      const launchBtn = document.getElementById("launchBtn");
      const installBtn = document.getElementById("installBtn");
      const retryBtn = document.getElementById("retryBtn");
      const footerEl = document.getElementById("footerNote");

      const isPWA = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;

      let activeUrl = "";
      let deferredPrompt = null;
      let redirectTimer = null;
      let pollTimer = null;

      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (!isPWA && installBtn) {
          installBtn.style.display = "inline-flex";
        }
      });

      if (installBtn) {
        installBtn.addEventListener("click", async () => {
          if (!deferredPrompt) return;
          deferredPrompt.prompt();
          try {
            await deferredPrompt.userChoice;
          } catch (e) {}
          deferredPrompt = null;
          installBtn.style.display = "none";
          if (activeUrl) {
            window.location.href = activeUrl;
          }
        });
      }

      const goToArena = () => {
        if (!activeUrl) return;
        window.location.href = activeUrl;
      };

      if (launchBtn) {
        launchBtn.addEventListener("click", goToArena);
      }

      if (retryBtn) {
        retryBtn.addEventListener("click", () => {
          checkServerStatus(true);
        });
      }

      const renderOnline = (url) => {
        activeUrl = url;
        chipEl.className = "status-chip online";
        chipTextEl.innerText = "Сервер онлайн";
        titleEl.innerText = "ouChess готова к бою";
        subEl.innerText = isPWA
          ? "Запуск приложения ouChess и перенаправление на активный шлюз…"
          : "Шлюз арены активен. Перенаправление в игру…";
        progressEl.style.display = "block";
        retryBtn.style.display = "none";
        launchBtn.style.display = "inline-flex";
        footerEl.innerText = isPWA ? "Режим приложения (PWA)" : "Можно установить как приложение на рабочий стол";

        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }
        if (redirectTimer) clearTimeout(redirectTimer);

        // Give beforeinstallprompt a brief window in browser mode, or fast launch in PWA
        const delayMs = isPWA ? 750 : 1400;
        redirectTimer = setTimeout(() => {
          if (!deferredPrompt || isPWA) {
            goToArena();
          }
        }, delayMs);
      };

      const renderMaintenance = () => {
        activeUrl = "";
        if (redirectTimer) {
          clearTimeout(redirectTimer);
          redirectTimer = null;
        }
        chipEl.className = "status-chip maintenance";
        chipTextEl.innerText = "Технические работы";
        titleEl.innerText = "Проект на техническом обслуживании";
        subEl.innerText = "Хост-сервер ouChess сейчас выключен. Как только администратор нажмёт «Захостить», эта страница автоматически откроет арену.";
        progressEl.style.display = "block";
        launchBtn.style.display = "none";
        retryBtn.style.display = "inline-flex";
        footerEl.innerText = "Автоматическая проверка статуса каждые 6 секунд";

        if (!pollTimer) {
          pollTimer = setInterval(() => checkServerStatus(false), 6000);
        }
      };

      const checkServerStatus = async (manual) => {
        if (manual) {
          chipTextEl.innerText = "Проверка подключения…";
        }
        const bust = Date.now();
        let targetUrl = "";
        let isOnline = false;

        try {
          const res = await fetch(`status.json?_=${bust}`, { cache: "no-store" });
          if (res.ok) {
            const data = await res.json();
            if (data && data.status === "online" && data.url && /^https?:\/\//i.test(data.url.trim())) {
              targetUrl = data.url.trim();
              isOnline = true;
            }
          }
        } catch (e) {}

        if (!isOnline) {
          try {
            const resTxt = await fetch(`link.txt?_=${bust}`, { cache: "no-store" });
            if (resTxt.ok) {
              const txt = (await resTxt.text()).trim();
              if (txt && /^https?:\/\//i.test(txt)) {
                targetUrl = txt;
                isOnline = true;
              }
            }
          } catch (e) {}
        }

        if (isOnline && targetUrl) {
          renderOnline(targetUrl);
        } else {
          renderMaintenance();
        }
      };

      checkServerStatus(false);
    })();
  </script>
</body>
</html>
